<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f2">
  <meta name="description" content="排除不想吃的，帮你决定今天吃什么。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>外卖点什么</title>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="./" aria-label="外卖点什么首页"><span class="brand-icon">吃</span><span>外卖点什么</span></a><button class="settings-button" id="manage-open" type="button" aria-label="管理我的食物" title="管理我的食物">＋ <span>我的食物</span></button></header>
    <main id="app" aria-live="polite"></main>
    <footer><span>今天吃什么，交给一点运气。</span><span>MADE FOR HUNGRY DAYS</span></footer>
  </div>
  <dialog id="manage-dialog" aria-labelledby="manage-title"><div class="dialog-heading"><div><p class="eyebrow">YOUR FOOD LIST</p><h2 id="manage-title">我的食物</h2></div><button class="icon-button" id="manage-close" aria-label="关闭" title="关闭">×</button></div><p class="muted">添加你喜欢的食物，它们会加入下次选择。</p><form id="food-form" class="add-form"><label class="sr-only" for="food-input">食物名称</label><input id="food-input" maxlength="20" placeholder="例如：酸菜鱼" autocomplete="off"><button class="button dark" type="submit">添加</button></form><p class="form-message" id="food-message" role="status"></p><div id="custom-list" class="custom-list"></div></dialog>
  <script src="app.js" defer></script>
</body>
</html>
